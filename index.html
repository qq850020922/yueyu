<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>粤讲粤掂 · 从零开始学粤语</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23c73e3a'/%3E%3Ctext x='32' y='45' font-size='36' text-anchor='middle' fill='%23fff' font-family='serif' font-weight='bold'%3E粤%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/song-study.css">
<link rel="stylesheet" href="css/yueyumao.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <div class="logo-sign">粤讲粤掂</div>
      <div class="logo-sub">JYUTPING · 从零到掂的 90 天</div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <div class="progress-mini">
        <div class="progress-mini-bar"><i id="sideProgressBar"></i></div>
        <span id="sideProgressText">0 / 90 天</span>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="菜单">☰</button>
      <div class="topbar-title" id="topbarTitle">首页</div>
      <div class="topbar-tools">
        <span class="voice-chip" id="voiceChip"><span class="dot"></span>检测语音中…</span>
        <label class="rate-ctl" title="调整朗读速度：0.6 慢速跟读起步，熟练后调回 0.9–1.0">
          <span>语速</span>
          <input type="range" id="rateSlider" min="0.5" max="1" step="0.05" value="1">
          <b id="rateVal">1.00</b>
        </label>
        <select id="voiceSelect" aria-label="系统粤语朗读音色" title="只列出浏览器可用的系统粤语音色；手机和微信可能不提供，教材录音不依赖此选项"></select>
        <select id="recordingSource" aria-label="例字录音音色" title="声母呼读和例字的录音来源；韵母主按钮固定使用粤拼方案示范录音"><option value="unified">例字 · 陈京英</option><option value="original">例字 · 原录音（多位）</option></select>
      </div>
    </header>

    <div class="pages">
      <section class="page" id="page-home"></section>
      <section class="page" id="page-initials"></section>
      <section class="page" id="page-finals"></section>
      <section class="page" id="page-blend"></section>
      <section class="page" id="page-tones"></section>
      <section class="page" id="page-poems"></section>
      <section class="page" id="page-songs"></section>
      <section class="page" id="page-phrases"></section>
      <section class="page" id="page-vocabulary"></section>
      <section class="page" id="page-plan"></section>
      <section class="page" id="page-quiz"></section>
      <section class="page" id="page-guide"></section>
    </div>

    <footer class="footer">
      粤讲粤掂 · 每天十五分钟，越讲越掂 &nbsp;|&nbsp; 全站粤拼经 Unicode Unihan 粤音库逐字校验
    </footer>
  </main>
</div>

<div class="modal-mask" id="modalMask"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script src="js/tts.js"></script>
<script src="js/data.js"></script>
<script src="js/poems-curriculum.js"></script>
<script src="js/poems-curriculum2.js"></script>
<script src="js/canto-dict.js"></script>
<script src="js/plan.js"></script>
<script src="js/phonetic-lessons.js"></script>
<script src="js/pronunciation-map.js"></script>
<script src="js/unified-voice-map.js"></script>
<script src="js/phoneme-map.js"></script>
<script src="js/pronunciation.js"></script>
<script src="js/lyrics.js"></script>
<script src="js/local-songs.js"></script>
<script src="js/song-study.js"></script>
<script src="js/yueyumao.js"></script>
<script src="js/app.js"></script>
</body>
</html>
